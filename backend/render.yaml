# Render blueprint for the Gigset API.
# Usage: Render dashboard → New → Blueprint → connect the gigset-web repo,
# point it at the `backend/` directory. Fill in the env vars below (all are
# already in the local backend/.env — copy values, never commit them).
services:
  - type: web
    name: strings-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Supabase transaction pooler (port 6543)
      - key: DIRECT_URL
        sync: false # Supabase session pooler (port 5432)
      - key: SUPABASE_URL
        sync: false # e.g. https://<ref>.supabase.co (no /rest/v1)
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false # deployed web origin, e.g. https://tanmayayay.github.io/gigset-web
      - key: ADMIN_EMAILS
        sync: false # comma separated sign-in emails that are always admins, e.g. you@gmail.com,partner@gmail.com
      # --- Optional: email alerts + weekly digest (Resend) ---
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # e.g. Gigset <hello@yourdomain.in> (domain verified in Resend)
      - key: EMAIL_SECRET
        sync: false # any long random string; signs unsubscribe links
      - key: API_PUBLIC_URL
        sync: false # e.g. https://strings-web.onrender.com
      - key: CRON_SECRET
        sync: false # same value as the GitHub secret used by the weekly digest job
      # --- Optional: browser push notifications (npx web-push generate-vapid-keys) ---
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # e.g. mailto:you@yourdomain.in
