<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google shows the first icon whose size is a multiple of 48px in search results. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TheGigSet: tying the music industry together. The professional network, discovery marketplace and newsroom for India's music & live-event industry." />
    <title>TheGigSet — Tying the music industry together</title>
    <!-- Link previews (WhatsApp, LinkedIn, X) read these without running the app. -->
    <meta property="og:site_name" content="TheGigSet" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TheGigSet — Tying the music industry together" />
    <meta property="og:description" content="The professional network, discovery marketplace and newsroom for India's music & live-event industry." />
    <meta property="og:url" content="https://thegigset.com/" />
    <meta property="og:image" content="https://thegigset.com/brand/share.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tells Google the site's name (and how people spell it) and its logo, without running the app. -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[
        {"@type":"WebSite","@id":"https://thegigset.com/#website","name":"TheGigSet","alternateName":["The GigSet","Gigset","GigSet India"],"url":"https://thegigset.com/"},
        {"@type":"Organization","@id":"https://thegigset.com/#org","name":"TheGigSet","alternateName":"Gigset","url":"https://thegigset.com/","logo":"https://thegigset.com/brand/favicon-512.png","description":"The professional network, discovery marketplace and newsroom for India's music and live-event industry."}
      ]}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint; system fonts show until they arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
